<section id="techstack" class="section" [@fadeInUp]="isVisible" (isVisible)="onVisibilityChange($event)" appIntersectionObserver>
  <div class="container">
    <p class="section__eyebrow">Skills</p>
    <h2 class="section__title">Tools I work with</h2>
    <div class="skills">
      <div class="card skills__card" *ngFor="let g of groups">
        <h3><i [class]="g.icon"></i> {{ g.title }}</h3>
        <div class="skills__chips"><span class="chip" *ngFor="let s of g.items">{{ s }}</span></div>
      </div>
    </div>
  </div>
</section>
